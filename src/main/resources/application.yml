spring:
  application:
    name: airport_kiosk
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${APP_USER}
    password: ${APP_USER_PASSWORD}
  sql:
    init:
      # 앱을 시작할 때마다 schema.sql, data.sql을 실행한다 (데이터 초기화)
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

airline:
  base-url: http://localhost:8080/mock-airline
  connect-timeout: 1s
  read-timeout: 3s

checkin:
  # 체크인은 출발 24시간 전부터 1시간 전까지 가능하다
  open-before: 24h
  close-before: 1h
